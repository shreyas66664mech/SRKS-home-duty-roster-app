<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Inner circular ring -->
  <circle cx="256" cy="220" r="140" fill="#071120" stroke="url(#gold)" stroke-width="10" filter="url(#glow)"/>

  <!-- Traditional OM Symbol (ॐ) -->
  <text x="256" y="275" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="160" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">ॐ</text>

  <!-- Subtitle banner: SRSH HOSTEL ROSTER -->
  <rect x="76" y="380" width="360" height="64" rx="20" fill="#0f233f" stroke="#f59e0b" stroke-width="3"/>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#fbbf24" letter-spacing="3" text-anchor="middle">SRSH DUTY ROSTER</text>
  
  <!-- Live sync dot indicator -->
  <circle cx="430" cy="82" r="14" fill="#10b981" filter="url(#glow)"/>
</svg>
